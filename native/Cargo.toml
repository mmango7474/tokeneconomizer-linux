[package]
name = "te-history"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Bounded local transcript discovery for TokenEconomizer warm-start"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
